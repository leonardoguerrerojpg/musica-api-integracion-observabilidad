# Configuracion del Servidor
server.port=8080

# Configuracion de conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/musica_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Observabilidad: Spring Boot Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# Configuracion de Logs
logging.level.com.ejemplo.musica=INFO